<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<rect width="1500" height="900" fill="#f7f8fb"/>
<text x="55" y="55" font-family="Arial" font-size="30" font-weight="bold" fill="#17243a">ClarifyRec — three interaction walkthroughs</text>
<text x="55" y="88" font-family="Arial" font-size="16" fill="#526174">Illustrative conversations supported by the local prototype; not user-study recordings.</text>
<g font-family="Arial">
<rect x="45" y="125" width="455" height="700" rx="18" fill="#ffffff" stroke="#c9d3e0" stroke-width="2"/>
<text x="70" y="170" font-size="23" font-weight="bold" fill="#1c3556">1. Ambiguous correction</text>
<rect x="70" y="205" width="350" height="82" rx="12" fill="#e8eef8"/><text x="90" y="238" font-size="17" fill="#17243a">User: “I want something</text><text x="90" y="263" font-size="17" fill="#17243a">lighter.”</text>
<rect x="105" y="315" width="365" height="160" rx="12" fill="#edf7f0"/><text x="125" y="350" font-size="17" fill="#17243a">System detects ambiguity and asks:</text><text x="125" y="385" font-size="16" fill="#17243a">1. Less emotionally intense</text><text x="125" y="415" font-size="16" fill="#17243a">2. More humorous</text><text x="125" y="445" font-size="16" fill="#17243a">3. Less serious</text>
<rect x="70" y="505" width="350" height="75" rx="12" fill="#e8eef8"/><text x="90" y="550" font-size="17" fill="#17243a">User: “More humorous.”</text>
<rect x="105" y="610" width="365" height="130" rx="12" fill="#edf7f0"/><text x="125" y="648" font-size="17" fill="#17243a">System resolves the question,</text><text x="125" y="678" font-size="17" fill="#17243a">adds comedy as a preference</text><text x="125" y="708" font-size="17" fill="#17243a">and displays recommendations.</text>
<rect x="522" y="125" width="455" height="700" rx="18" fill="#ffffff" stroke="#c9d3e0" stroke-width="2"/>
<text x="547" y="170" font-size="23" font-weight="bold" fill="#1c3556">2. Revised preference</text>
<rect x="547" y="205" width="350" height="82" rx="12" fill="#e8eef8"/><text x="567" y="238" font-size="17" fill="#17243a">User: “I dislike comedy.”</text>
<rect x="582" y="315" width="365" height="105" rx="12" fill="#edf7f0"/><text x="602" y="355" font-size="17" fill="#17243a">System adds comedy to</text><text x="602" y="385" font-size="17" fill="#17243a">the dislike profile.</text>
<rect x="547" y="450" width="350" height="82" rx="12" fill="#e8eef8"/><text x="567" y="483" font-size="17" fill="#17243a">User: “Actually, I like comedy.”</text>
<rect x="582" y="560" width="365" height="150" rx="12" fill="#edf7f0"/><text x="602" y="600" font-size="17" fill="#17243a">System removes comedy from</text><text x="602" y="630" font-size="17" fill="#17243a">dislikes, adds it to likes,</text><text x="602" y="660" font-size="17" fill="#17243a">and preserves unrelated choices.</text>
<rect x="999" y="125" width="455" height="700" rx="18" fill="#ffffff" stroke="#c9d3e0" stroke-width="2"/>
<text x="1024" y="170" font-size="23" font-weight="bold" fill="#1c3556">3. Clear correction</text>
<rect x="1024" y="205" width="375" height="100" rx="12" fill="#e8eef8"/><text x="1044" y="245" font-size="17" fill="#17243a">User: “I don't want a</text><text x="1044" y="275" font-size="17" fill="#17243a">tragic ending.”</text>
<rect x="1059" y="335" width="365" height="135" rx="12" fill="#edf7f0"/><text x="1079" y="375" font-size="17" fill="#17243a">System recognises a clear</text><text x="1079" y="405" font-size="17" fill="#17243a">constraint and updates the</text><text x="1079" y="435" font-size="17" fill="#17243a">profile without clarification.</text>
<rect x="1024" y="500" width="375" height="170" rx="12" fill="#f4efff"/><text x="1044" y="540" font-size="17" fill="#17243a">Recommendation ranking</text><text x="1044" y="570" font-size="17" fill="#17243a">strongly penalises movies</text><text x="1044" y="600" font-size="17" fill="#17243a">marked with tragic endings.</text><text x="1044" y="640" font-size="15" fill="#526174">Preference remains visible in sidebar.</text>
</g>
</svg>
